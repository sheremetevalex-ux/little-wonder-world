<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Wonder World</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="description" content="Волшебный мир игр для маленьких: наряды, малыши, торты, слайм, рисование, музыка и приключения. Без рекламы и регистрации.">
<meta name="theme-color" content="#3C2E9E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wonder World">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!--STARTUP-IMAGES-->
<style>
html,body{margin:0;height:100%;background:#3C2E9E;overflow:hidden;position:fixed;inset:0;width:100%;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#3C2E9E,#FF9CC4)}
/* fixed, so that a body shorter than the real screen can never clip the game */
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
#gl{pointer-events:none}
#install{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);display:none;
  font:600 15px/1.2 -apple-system,system-ui,sans-serif;color:#3A2A57;background:rgba(255,255,255,.92);border:0;border-radius:24px;padding:12px 18px;white-space:nowrap;box-shadow:0 6px 20px rgba(40,20,90,.3)}
#guide{position:fixed;inset:0;background:rgba(40,20,90,.55);display:none;align-items:center;justify-content:center;padding:20px;font:16px/1.4 -apple-system,system-ui,sans-serif;color:#3A2A57;-webkit-user-select:none}
#guide>div{background:#fff;border-radius:24px;padding:22px;max-width:340px;box-shadow:0 12px 40px rgba(40,20,90,.4)}
#guide h2{margin:0 0 12px;font-size:19px}#guide ol{margin:0 0 16px;padding-left:22px}#guide li{margin:8px 0}
#guide button{width:100%;font:600 16px -apple-system,system-ui,sans-serif;color:#fff;background:#8C68F2;border:0;border-radius:16px;padding:12px}
</style>
</head>
<body>
<canvas id="gl" style="display:none"></canvas>
<canvas id="game"></canvas>
<button id="install" type="button"></button>
<div id="guide" role="dialog"><div><h2 id="gt"></h2><ol id="gl"></ol><button id="gc" type="button">OK</button></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
